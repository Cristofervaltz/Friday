[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.7.0"
description = "Friday: a desktop automation assistant foundation for developers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Friday Contributors" }
]
keywords = ["automation", "desktop", "developer-tools", "foundation"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "urllib3>=2.0.0",
  "mcp>=1.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "pygetwindow>=0.0.9",
  "pyautogui>=0.9.54",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "black>=24.0.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
  "types-requests",
  "types-beautifulsoup4",
  "types-pyautogui",
]
speech = [
  "SpeechRecognition>=3.10.0",
  "PyAudio>=0.2.14",
  "edge-tts>=6.0.0",
  "pygame>=2.5.0",
  "vosk>=0.3.45",
  "sounddevice>=0.4.6"
]
vision = [
  "mss>=9.0.0",
  "Pillow>=10.0.0"
]
rag = [
  "chromadb>=0.4.0",
  "sentence-transformers>=2.0.0"
]
daemon = [
  "pystray>=0.19.3",
  "pynput>=1.7.6",
  "watchdog>=3.0.0",
  "Pillow>=10.0.0"
]
gui = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "websockets>=11.0.3",
  "pywebview>=4.0.0"
]

[project.scripts]
friday = "src.main:main"
friday-daemon = "src.daemon.main:main"
friday-gui = "src.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''(src/ui/.*|\.agents/.*)'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    ".env",
    "src/ui",
    ".agents"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

# Ignore E402 (module level import not at top) for examples
# Examples need to modify sys.path before importing project modules
[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
pretty = true
show_error_codes = true
warn_unused_configs = true
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    "venv",
    ".env",
    "src/ui",
    ".agents"
]
files = ["src", "tests"]
