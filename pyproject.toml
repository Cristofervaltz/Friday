[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "0.6.0"
description = "Friday: a desktop automation assistant foundation for developers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Friday Contributors" }
]
keywords = ["automation", "desktop", "developer-tools", "foundation"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "urllib3>=2.0.0",
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "black>=24.0.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
  "types-requests"
]
speech = [
  "SpeechRecognition>=3.10.0",
  "PyAudio>=0.2.14"
]
vision = [
  "mss>=9.0.0",
  "Pillow>=10.0.0"
]
rag = [
  "chromadb>=0.4.0",
  "sentence-transformers>=2.0.0"
]

[project.scripts]
friday = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

# Ignore E402 (module level import not at top) for examples
# Examples need to modify sys.path before importing project modules
[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
pretty = true
show_error_codes = true
warn_unused_configs = true
files = ["src", "tests"]
